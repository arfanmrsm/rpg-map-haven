<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main Menu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { cursor: none !important; }
    body { background: transparent; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    #cursor-dot { width: 6px; height: 6px; background-color: #00ffcc; border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
    #cursor-ring { width: 44px; height: 44px; border: 1.5px solid #00f2fe; border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
  </style>
</head>
<body class="bg-slate-900/60 backdrop-blur-md px-4 py-2 border-b border-cyan-500/20">
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <nav class="max-w-7xl mx-auto">
    <ul class="flex flex-wrap justify-center md:justify-start gap-1 font-mono text-sm list-none p-0 m-0">
      <li><a href="index.html" target="_parent" class="px-4 py-2 rounded-md transition-all flex items-center gap-2 text-slate-300 hover:text-cyan-300 hover:bg-slate-800/60 border border-transparent"><i class="fa-solid fa-house text-xs"></i> Home</a></li>
      <li><a href="hi.html" target="_parent" class="px-4 py-2 rounded-md transition-all flex items-center gap-2 text-slate-300 hover:text-cyan-300 hover:bg-slate-800/60 border border-transparent"><i class="fa-solid fa-user-astronaut text-xs"></i> Hi / About</a></li>
      <li><a href="places.html" target="_parent" class="px-4 py-2 rounded-md transition-all flex items-center gap-2 text-slate-300 hover:text-cyan-300 hover:bg-slate-800/60 border border-transparent"><i class="fa-solid fa-earth-asia text-xs"></i> Favorite Places</a></li>
      <li><a href="skills.html" target="_parent" class="px-4 py-2 rounded-md transition-all flex items-center gap-2 text-slate-300 hover:text-cyan-300 hover:bg-slate-800/60 border border-transparent"><i class="fa-solid fa-code text-xs"></i> Computing Skills</a></li>
      <li><a href="media.html" target="_parent" class="px-4 py-2 rounded-md transition-all flex items-center gap-2 text-slate-300 hover:text-cyan-300 hover:bg-slate-800/60 border border-transparent"><i class="fa-solid fa-photo-film text-xs"></i> Favorite Media</a></li>
      <li><a href="mailto:arfanmrsm@gmail.com" target="_parent" class="px-4 py-2 rounded-md transition-all flex items-center gap-2 text-slate-300 hover:text-cyan-300 hover:bg-slate-800/60 border border-transparent"><i class="fa-solid fa-envelope text-xs"></i> Contact</a></li>
    </ul>
  </nav>

  <script>
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    window.addEventListener('mousemove', (e) => {
      dot.style.left = `${e.clientX}px`; dot.style.top = `${e.clientY}px`;
      ring.style.left = `${e.clientX}px`; ring.style.top = `${e.clientY}px`;
    });
  </script>
</body>
</html>
